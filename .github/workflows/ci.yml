name: Verify

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Most pull requests change only Python and shell under scripts/, which the Rust and Go jobs cannot judge: of 60
  # recent PRs, 48 touched nothing they read, and each still spent about 295 runner-seconds on lint, test, cli and go.
  # Those jobs now run for a pull request only when it changes something they read. A script counts as Rust input
  # when src/, tests/ or the cli job names it (scripts/bootstrap, for one). Pushes to main run everything, and
  # scripts and runner-tests always run, since several script tests drive cargo.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      go: ${{ steps.scope.outputs.go }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The pull request's merge commit and its first parent, the base it merges into.
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Decide which jobs this change needs
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if test "$EVENT" != pull_request; then
            printf 'rust=true\ngo=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rust=false
          go=false
          # Scripts that Rust tests run: the modules they load are Rust input too (fleet_bundle.py through
          # scripts/test-fleet-bundle.py, for one).
          rust_named=$(grep -rhoE 'scripts/[A-Za-z0-9_./-]+' src tests | sort -u | while read -r f; do
            if test -f "$f"; then echo "$f"; fi
          done)
          # --no-renames lists a rename's old path too; writing to a file first fails the job, not open, on error.
          git diff --no-renames --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed"
          while IFS= read -r path; do
            case "$path" in
              docs/MODULE_INVENTORY.md) rust=true ;;
              docs/*|*.md) ;;
              .github/workflows/ci.yml) rust=true; go=true ;;
              tools/scaleset-bridge/*) go=true ;;
              scripts/bootstrap|scripts/workspace_bootstrap/*) rust=true ;;
              .github/*|.claude/*|skills/*) ;;
              scripts/*)
                # The script's name as a whole word: glaeda-gh is not named by glaeda-gha-{token}.
                # shellcheck disable=SC2086
                if grep -rqwF -- "${path#scripts/}" src tests $rust_named; then
                  echo "Rust sources or the scripts they run name $path"
                  rust=true
                fi
                ;;
              *) rust=true ;;
            esac
          done < "$RUNNER_TEMP/changed"
          printf 'rust=%s\ngo=%s\n' "$rust" "$go" | tee -a "$GITHUB_OUTPUT"

  go:
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          show-progress: false

      - name: Install pinned Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: tools/scaleset-bridge/go.mod
          cache-dependency-path: tools/scaleset-bridge/go.sum

      - name: Verify Runner Scale Set bridge
        working-directory: tools/scaleset-bridge
        run: |
          go mod verify
          gofmt -d -e . | tee /tmp/glaeda-scaleset-gofmt.diff
          test ! -s /tmp/glaeda-scaleset-gofmt.diff
          go vet ./...
          go test ./...
          go build -trimpath -o /tmp/glaeda-scaleset-bridge .


  # Script syntax and every script test file but the runner's, which runner-tests shards.
  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          show-progress: false

      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install 1.97.1
          --profile minimal
          --component clippy,rustfmt
          --no-self-update

      - name: Validate and test scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path("smolrunner"),
              Path("scripts/bootstrap"),
              Path("scripts/benchmark-hot-state-fanout"),
              Path("scripts/benchmark-pnpm-task-dependencies"),
