              Path("scripts/cmux_workload_request.py"),
              Path("scripts/test-cmux-workload-request.py"),
              Path("scripts/owned-fleet-benchmark"),
              Path("scripts/test-owned-fleet-benchmark.py"),
              *Path("scripts/owned_fleet_benchmark").glob("*.py"),
              Path("scripts/test-verify-focused.py"),
              Path("scripts/verify-changed-rustfmt"),
              Path("scripts/test-hot-run.py"),
              Path("scripts/test-hot-pressure-shadow.py"),
              Path("scripts/test-benchmark-hot-state-fanout.py"),
              Path("scripts/test-benchmark-pnpm-task-dependencies.py"),
              Path("scripts/test-benchmark-linker-throughput.py"),
              Path("scripts/test-hot-observe.py"),
              Path("scripts/glaeda-disk"),
              Path("scripts/test-glaeda-disk.py"),
              Path("scripts/glaeda-procs"),
              Path("scripts/test-glaeda-procs.py"),
              Path("scripts/glaeda-local-guard"),
              Path("scripts/test-glaeda-local-guard.py"),
              Path("scripts/glaeda-update"),
              Path("scripts/glaeda_release.py"),
              Path("scripts/test-glaeda-update.py"),
              Path("scripts/glaeda-fleet-cas-prune"),
              Path("scripts/test-glaeda-fleet-cas-prune.py"),
              Path("scripts/glaeda-seed-prefetch"),
              Path("scripts/test-glaeda-seed-prefetch.py"),
              Path("scripts/glaeda-idle-warm"),
              Path("scripts/test-glaeda-idle-warm.py"),
              Path("scripts/glaeda-mini-health"),
              Path("scripts/test-glaeda-mini-health.py"),
              Path("scripts/glaeda-seed-serve"),
              Path("scripts/glaeda-seed-lan"),
              Path("scripts/test-glaeda-seed-lan.py"),
              Path("scripts/glaeda-lan-fetch"),
              Path("scripts/test-glaeda-lan-fetch.py"),
              Path("scripts/glaeda-gh"),
              Path("scripts/test-glaeda-gh.py"),
              Path("scripts/test-verify.py"),
              Path("scripts/test-verify-changed-rustfmt.py"),
              Path("scripts/test-front-door.py"),
              Path("scripts/project_disk_physical_receipt.py"),
              Path("scripts/test_project_disk_physical_receipt.py"),
              Path("scripts/quarry_sweep_impl.py"),
              Path("scripts/test-quarry-sweep.py"),
              Path("scripts/quarry_parallel_impl.py"),
              Path("scripts/test-quarry-parallel.py"),
              Path("scripts/status_page.py"),
              Path("scripts/test-status-page.py"),
              Path("scripts/unittest-shard"),
              Path("scripts/test-unittest-shard.py"),
              *Path("scripts/workspace_bootstrap").glob("*.py"),
          ]
          for path in paths:
              compile(path.read_text(encoding="utf-8"), str(path), "exec")
          PY
          test -x ./smolrunner
          sh -n scripts/hot-run
          bash -n scripts/benchmark-developer-loop
          bash -n scripts/test-bootstrap.sh
          bash -n scripts/cmux-fleet
          bash -n scripts/cmux-fleet-bootstrap-macos
          bash -n scripts/cmux-fleet-bootstrap-linux
          bash -n scripts/glaeda-worktree-reclaim-all
          bash -n scripts/cmux_mini_probe.sh
          bash -n scripts/cmux_mini_preflight.sh
          bash -n scripts/cmux_mini_fix.sh
          bash scripts/test-bootstrap.sh
          python3 scripts/test-benchmark-developer-loop.py
          python3 scripts/test-benchmark-hot-state-fanout.py
          python3 scripts/test-benchmark-pnpm-task-dependencies.py
          python3 scripts/test-benchmark-linker-throughput.py
          python3 scripts/test-hot-observe.py
          python3 scripts/test-glaeda-disk.py
          python3 scripts/test-glaeda-procs.py
          python3 scripts/test-glaeda-local-guard.py
          python3 scripts/test-glaeda-update.py
          python3 scripts/test-glaeda-fleet-cas-prune.py
          python3 scripts/test-glaeda-seed-prefetch.py
          python3 scripts/test-glaeda-idle-warm.py
          python3 scripts/test-glaeda-mini-health.py
          python3 scripts/test-glaeda-seed-lan.py
          python3 scripts/test-glaeda-lan-fetch.py
          python3 scripts/test-glaeda-gh.py
          python3 scripts/test-hot-pressure-shadow.py
          python3 scripts/test-hot-run.py
          python3 scripts/test-verify-focused.py
          python3 scripts/test-owned-linux-admission.py
          python3 scripts/test-owned-linux-jit-task.py
          python3 scripts/test-repository-agent-work.py
          python3 scripts/test-external-execution-request.py
          python3 scripts/test-trusted-agent-dispatch.py
          python3 scripts/test-provider-neutral-request.py
          python3 scripts/test-owner-local-dispatch.py
          python3 scripts/test-cmux-fleet.py
          python3 scripts/test-cmux-fleet-operator-summary.py
          python3 scripts/test-cmux-fleet-bootstrap.py
          python3 scripts/test-glaeda-mini-setup.py
          python3 scripts/test-glaeda-mini-enroll.py
          python3 scripts/test-glaeda-cmux-runner-fleet.py
          python3 scripts/test-glaeda-mini-fleet.py
          python3 scripts/test-glaeda-fleet-status.py
          python3 scripts/test-glaeda-route.py
          python3 scripts/test-cmux-execution-roles.py
          python3 scripts/test-cmux-workload-request.py
          python3 scripts/test-owned-fleet-benchmark.py
          python3 scripts/test-verify.py
          python3 scripts/test-verify-changed-rustfmt.py
          python3 scripts/test-front-door.py
          python3 scripts/test-quarry-sweep.py
          python3 scripts/test-quarry-parallel.py
          python3 scripts/test-status-page.py
          python3 scripts/test-unittest-shard.py
          # a test that leaves files in the checkout fails, as it did before the split
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Validate Mac helper scripts
        run: |
          python3 scripts/test_project_disk_physical_receipt.py
          bash -n \
            scripts/macbook-runner-bootstrap.sh \
            scripts/macbook-runner-observe.sh \
            scripts/macbook-runner-vm.sh \
            scripts/macbook-workspace.sh \
            scripts/quarry-trusted-runner.sh \
            scripts/test-macbook-runner-bootstrap.sh \
            scripts/test-macbook-runner-vm.sh \
            scripts/test-macbook-runner-vm-paths.sh \
            scripts/test-quarry-trusted-runner.sh
          bash scripts/test-macbook-runner-bootstrap.sh
          bash scripts/test-macbook-runner-vm.sh
          bash scripts/test-macbook-runner-vm-paths.sh
          bash scripts/test-quarry-trusted-runner.sh
          bash scripts/macbook-workspace.sh help >/dev/null
          bash scripts/macbook-workspace.sh notify-doctor 0
          if grep -Eq 'allowAll|openAccess|CMUX_SOCKET_(PATH|PASSWORD)' scripts/macbook-workspace.sh; then
            printf 'error: Mac workspace helper widens cmux socket authority\n' >&2
            exit 1
          fi

      - name: Validate Glaeda Lima example aliases
        run: |
          cmp examples/lima/smolrunner-interactive.yaml examples/lima/glaeda-interactive.yaml
          cmp examples/lima/smolrunner-jit-launcher examples/lima/glaeda-jit-launcher
          cmp examples/lima/smolrunner-prepared-template.json examples/lima/glaeda-prepared-template.json
          cmp examples/lima/smolrunner-prepared-template.yaml examples/lima/glaeda-prepared-template.yaml
          cmp examples/lima/smolrunner-runner-integrity examples/lima/glaeda-runner-integrity
          cmp examples/lima/smolrunner-work.yaml examples/lima/glaeda-work.yaml
          bash -n examples/lima/glaeda-jit-launcher
          bash -n examples/lima/glaeda-runner-integrity

      - name: Validate repository verification wrappers
        run: bash -n examples/renderprove/run-renderprove-review.sh


  # scripts/test-glaeda-cmux-runner.py took about 300 s of the old single job; its shards run side by side.
  runner-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          show-progress: false

      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install 1.97.1
          --profile minimal
          --component clippy,rustfmt
          --no-self-update

      - name: Run runner and hook tests (shard ${{ matrix.shard }} of 4)
        run: |
          python3 scripts/unittest-shard scripts/test-glaeda-cmux-runner.py ${{ matrix.shard }} 4
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  # rust was one serial job of about 4.4 min (cache restore 69 s, check and two clippy runs 70 s, tests 100 s);
  # lint and test now run side by side.
  lint:
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Line tables are for local debugging; in CI they only make the target dir, every cache restore and each test
    # binary's link bigger. The environment, not ~/.cargo/config.toml: local_install_build_execution's tests refuse
    # an ambient cargo config, as a real install would.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          show-progress: false

      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install 1.97.1
          --profile minimal
          --component clippy,rustfmt
          --no-self-update

      # Pull requests read the generation the last main push published; only main writes, so the cache stays
      # proportional to main, not to open branches. Each job keeps only its own artifacts, so each restore is small.
      - name: Restore cargo build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: verify-cargo-lint-${{ runner.os }}-${{ runner.arch }}-rust-1.97.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            verify-cargo-lint-${{ runner.os }}-${{ runner.arch }}-rust-1.97.1-

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Cross-check the documented Apple Silicon Lima guest target.
      - name: Install ARM64 Linux target
        run: rustup target add aarch64-unknown-linux-gnu

      - name: Check ARM64 Linux build
        run: cargo check --locked --target aarch64-unknown-linux-gnu

      # Keep the operator CLI buildable on its supported Apple Silicon host.
      - name: Install Apple Silicon target
        run: rustup target add aarch64-apple-darwin

      # Glaeda is developed on Apple Silicon, so the repository's own `required` profile has to
      # pass in the macOS `cfg` configuration, not only the Linux one this job runs natively.
      # `cargo check` already compiled that configuration and already printed the `cfg` drift it
      # sees -- code whose only consumers are `target_os = "linux"` -- but nothing promoted those
      # warnings to errors, so `./scripts/verify required` could be broken on the author's machine
      # while this job stayed green. Clippy with `-D warnings` subsumes the previous check and
      # closes that gap without needing a macOS runner.
      - name: Lint Apple Silicon build
        run: >-
          cargo clippy --locked --all-targets --all-features
          --target aarch64-apple-darwin -- -D warnings

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Save cargo build cache
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: verify-cargo-lint-${{ runner.os }}-${{ runner.arch }}-rust-1.97.1-${{ hashFiles('Cargo.lock') }}

  test:
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Line tables are for local debugging; in CI they only make the target dir, every cache restore and each test
    # binary's link bigger. The environment, not ~/.cargo/config.toml: local_install_build_execution's tests refuse
    # an ambient cargo config, as a real install would.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          show-progress: false

      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install 1.97.1
          --profile minimal
          --component clippy,rustfmt
          --no-self-update

      # Pull requests read the generation the last main push published; only main writes, so the cache stays
      # proportional to main, not to open branches. Each job keeps only its own artifacts, so each restore is small.
      - name: Restore cargo build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: verify-cargo-test-${{ runner.os }}-${{ runner.arch }}-rust-1.97.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            verify-cargo-test-${{ runner.os }}-${{ runner.arch }}-rust-1.97.1-

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

      - name: Save cargo build cache
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: verify-cargo-test-${{ runner.os }}-${{ runner.arch }}-rust-1.97.1-${{ hashFiles('Cargo.lock') }}

  # The workspace bootstrap receipt and the operator CLI's own entry points (front door, doctor, plans). The front
  # door's cargo run scrubs the environment, so it builds the default profile; here that is the only build.
  cli:
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          show-progress: false

      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install 1.97.1
          --profile minimal
          --component clippy,rustfmt
          --no-self-update

      - name: Validate workspace bootstrap
        run: |
          first_receipt=$(mktemp)
          second_receipt=$(mktemp)
          bootstrap_cache_root=$(mktemp -d)
          mkdir -p \
            "$bootstrap_cache_root/cargo-home" \
            "$bootstrap_cache_root/cargo-target"
          trap 'rm -f "$first_receipt" "$second_receipt" "$first_receipt.stable" "$second_receipt.stable"; rm -rf "$bootstrap_cache_root"' EXIT
          CARGO_HOME="$bootstrap_cache_root/cargo-home" \
            CARGO_TARGET_DIR="$bootstrap_cache_root/cargo-target" \
            ./scripts/bootstrap --output json > "$first_receipt"
          CARGO_HOME="$bootstrap_cache_root/cargo-home" \
            CARGO_TARGET_DIR="$bootstrap_cache_root/cargo-target" \
            ./scripts/bootstrap --output json > "$second_receipt"

          jq -e '
            .schema_version == 2 and
            .receipt_type == "glaeda-workspace-capability-receipt" and
            (.state == "ready" or .state == "ready_with_declared_deviations") and
            .source.clean_before == true and
            .source.clean_after == true and
            .source.cleanliness_unchanged == true and
            (.source.commit | test("^[0-9a-f]{40}$")) and
            (.source.tree | test("^[0-9a-f]{40}$")) and
            .repository_root.private_path_exposed == false and
            (all(.declared_cache_paths[];
              .path_class == "external-private" and
              .ownership == "current-user" and
              .path_exposed == false)) and
            (.next_verification_profiles == ["glaeda.required", "glaeda.doctor", "glaeda.plan"])
          ' "$first_receipt"
          jq -S 'del(
            .capability_fingerprint,
            .resources.available_memory_mib,
            .resources.available_swap_mib,
            .resources.available_memory_bytes,
            .resources.available_swap_bytes,
            .verification_profile_compatibility.resources.available_memory_bytes,
            .verification_profile_compatibility.resources.available_swap_bytes
          )' "$first_receipt" > "$first_receipt.stable"
          jq -S 'del(
            .capability_fingerprint,
            .resources.available_memory_mib,
            .resources.available_swap_mib,
            .resources.available_memory_bytes,
            .resources.available_swap_bytes,
            .verification_profile_compatibility.resources.available_memory_bytes,
            .verification_profile_compatibility.resources.available_swap_bytes
          )' "$second_receipt" > "$second_receipt.stable"
          cmp "$first_receipt.stable" "$second_receipt.stable"
          if test "$(jq -r '.resources.available_memory_bytes, .resources.available_swap_bytes' "$first_receipt")" = \
            "$(jq -r '.resources.available_memory_bytes, .resources.available_swap_bytes' "$second_receipt")"; then
            test "$(jq -r .capability_fingerprint "$first_receipt")" = \
              "$(jq -r .capability_fingerprint "$second_receipt")"
          fi
          if grep -Fq "$HOME" "$first_receipt"; then
            printf 'error: workspace receipt exposed HOME\n' >&2
            exit 1
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          cat "$first_receipt"

      # The front door's cargo run is --offline: fetch and build first, as cargo test did when these ran in one job.
      # Its scrubbed environment builds the default dev profile, which lint and test (no debuginfo) do not share, so
      # this job keeps its own main-written cache; without one the build was cold on every run (49 s).
      - name: Restore cargo build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: verify-cargo-cli-${{ runner.os }}-${{ runner.arch }}-rust-1.97.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            verify-cargo-cli-${{ runner.os }}-${{ runner.arch }}-rust-1.97.1-

      - name: Build the CLI
        run: cargo build --locked

      - name: Exercise root Glaeda front door
        run: |
          ./glaeda --output json | jq -e '
            .schema_version == 2 and
            .receipt_type == "glaeda-front-door-readiness-receipt" and
            .verdict == "ready" and
            .doctor.evaluated == true and
            (.doctor.overall == "pass" or .doctor.overall == "warn") and
            .next_action == "none"
          '
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Exercise machine-readable doctor output
        run: cargo run --locked --quiet -- --output json doctor

      - name: Validate reference plans
        run: |
          cargo run --locked --quiet -- plan --file examples/quarry.yml
          cargo run --locked --quiet -- --output json plan --file examples/glossless.yml \
            | jq -e '.schema_version == 1 and (.actions | length == 4)'
          cargo run --locked --quiet -- --output json plan --file examples/renderprove.yml \
            | jq -e '.schema_version == 1 and (.actions | length == 4) and (.actions[3].detail | contains("run-renderprove-review.sh"))'

      - name: Exercise read-only host planning
        run: |
          cargo run --locked --quiet -- --output json host plan --file examples/quarry.yml \
            | jq -e '.schema_version == 1 and .disposition and (.findings | type == "array") and (.report.executables | length == 3) and .report.package_plan and .report.runner_account'

      - name: Save cargo build cache
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: verify-cargo-cli-${{ runner.os }}-${{ runner.arch }}-rust-1.97.1-${{ hashFiles('Cargo.lock') }}

  # One check that stands for the whole workflow, under the old single job's name.
  verify:
    if: ${{ always() }}
    needs: [changes, go, scripts, runner-tests, lint, test, cli]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every Verify job
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            # A job this change cannot affect is skipped, not failed.
            test "$result" = success || test "$result" = skipped
          done
