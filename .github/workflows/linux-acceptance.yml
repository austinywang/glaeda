name: Linux acceptance

on:
  pull_request:
    paths:
      - .github/workflows/linux-acceptance.yml
      - scripts/macbook-runner-vm.sh
      - scripts/test-macbook-runner-vm.sh
      - scripts/test-macbook-runner-vm-paths.sh
      - scripts/run-linux-acceptance.sh
      - tests/linux_acceptance.rs
      - src/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disposable-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install native musl linker
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools

      - name: Run disposable Debian and Ubuntu acceptance tests
        run: bash scripts/run-linux-acceptance.sh
