[package]
name = "glaeda"
version = "0.1.0"
edition = "2024"
description = "Glaeda is a local-first runtime for hot, trust-tiered Linux compute on operator-controlled machines"
repository = "https://github.com/teamleaderleo/glaeda"
license = "Apache-2.0"
keywords = ["github-actions", "self-hosted", "runner", "podman", "devops"]
categories = ["command-line-utilities", "development-tools"]
publish = false
default-run = "glaeda"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml = { package = "serde_norway", version = "0.9.42" }
sha1 = "0.10"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
# `mount` exposes Linux open_tree/move_mount through rustix without unsafe project code.
rustix = { version = "1.1.4", features = ["event", "fs", "mount", "process", "rand", "thread"] }
# Convert SIGTERM/SIGINT into bounded process-group termination without unsafe project handlers.
signal-hook = { version = "=0.4.4", default-features = false }
# Guarantee compiler-resistant wiping for controller credentials and one-time JIT material.
zeroize = "1.8.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Seal an admitted benchmark's CPU affinity without project-local unsafe BPF code.
seccompiler = { version = "0.5.0", default-features = false }
# Supply the audited syscall and errno constants used by the one-rule seccomp filter.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Read the controller GitHub App key directly from the macOS Keychain without a secret-bearing
# subprocess, argv, environment, or public execution record.
security-framework = { version = "3.7.0", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

# Keep source line tables for useful backtraces while avoiding full local-variable debug data in
# ordinary development and test artifacts. macOS also defaults to unpacked split debug information;
# with this crate's many test targets that creates hundreds of thousands of sidecar objects and
# makes each newly linked test stall in dyld before main. Keep DWARF in the binaries instead; Linux
# already defaults to this layout.
[profile.dev]
debug = 1
split-debuginfo = "off"

[profile.test]
debug = 1
split-debuginfo = "off"
