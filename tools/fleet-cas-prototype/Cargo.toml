[package]
name = "fleet-cas"
version = "0.0.1"
edition = "2024"

[dependencies]
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "signal", "sync"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2"

[dev-dependencies]
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
tonic-prost-build = "0.14"
protox = "0.9"

# Standalone: not part of the glaeda crate.
[workspace]
